<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #0F0A05; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .middle { flex: 1; overflow-y: auto; background: red; }
  .mobile-frame { flex: 1; width: 100%; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; background: blue; overflow: hidden; min-height: 100vh; }
  .ptr { height: 100%; width: 100%; overflow-y: auto; background: green; }
  .content { height: 2000px; background: linear-gradient(green, yellow); }
</style>
</head>
<body>
  <div class="middle">
    <div class="mobile-frame">
      <div class="ptr">
        <div class="content">Content</div>
      </div>
    </div>
  </div>
</body>
</html>
