name: iOS Build & Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy iOS
    runs-on: macos-15 # macOS 15 tem o Xcode 16, necessário para o formato de projeto 77
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Isolamento do Projeto
        run: |
          echo "Removendo interferências da raiz..."
          rm -f package.json package-lock.json
          rm -rf node_modules
          rm -rf "cópia" "-" "deps"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: mais-vaquejada
        run: |
          npm install --force

      - name: Build Web Assets
        working-directory: mais-vaquejada
        run: npm run build

      - name: Capacitor de Sincronização
        working-directory: mais-vaquejada
        run: |
          echo "Limpando caches do Xcode..."
          rm -rf ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          rm -rf ios/App/App.xcworkspace/xcshareddata/swiftpm/Package.resolved
          
          echo "Sincronizando plugins..."
          npx cap sync ios --deployment

      - name: Instale o certificado Apple e o perfil de provisionamento.
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build and Upload to App Store
        working-directory: mais-vaquejada/ios/App
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          echo "Resolvendo SPM com Xcode 16..."
          xcodebuild -resolvePackageDependencies
          
          echo "Archive..."
          xcodebuild -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     archive

          echo "IPA..."
          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     -exportOptionsPlist App/ExportOptions.plist \
                     -exportPath $RUNNER_TEMP/export \
                     -allowProvisioningUpdates

          echo "Upload..."
          xcrun altool --upload-app \
                       --type ios \
                       --file $RUNNER_TEMP/export/App.ipa \
                       --apiKey "$APP_STORE_CONNECT_KEY_ID" \
                       --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
