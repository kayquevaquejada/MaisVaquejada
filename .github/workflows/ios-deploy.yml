name: iOS Build & Deploy

on:
  workflow_dispatch: # Permite rodar manualmente pelo site do GitHub

jobs:
  deploy:
    name: Build and Deploy iOS
    runs-on: macos-15 # No futuro (Abril 2026), macos-15 ou macos-latest terá o Xcode 26
    defaults:
      run:
        working-directory: mais-vaquejada
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install


      - name: Build Web Assets
        run: npm run build

      - name: Capacitor de Sincronização
        run: |
          echo "Verificando arquivos..."
          ls -R node_modules/@capacitor-community/apple-sign-in || echo "Plugin não encontrado"
          npx cap sync ios --deployment

      - name: Instale o certificado Apple e o perfil de provisionamento.
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build and Upload to App Store
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          # Resolve dependencies
          xcodebuild -project ios/App/App.xcodeproj -resolvePackageDependencies

          # Build archive
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     archive

          # Export IPA
          # Nota: Você precisará de um arquivo ExportOptions.plist no seu projeto
          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     -exportOptionsPlist ios/App/App/ExportOptions.plist \
                     -exportPath $RUNNER_TEMP/export \
                     -allowProvisioningUpdates

          # Upload via altool or xcrun ditto
          xcrun altool --upload-app \
                       --type ios \
                       --file $RUNNER_TEMP/export/App.ipa \
                       --apiKey "$APP_STORE_CONNECT_KEY_ID" \
                       --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
