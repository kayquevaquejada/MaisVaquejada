workflows:
  ios-workflow:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          cd mais-vaquejada && npm install --force
      - name: Build Web Assets
        script: |
          cd mais-vaquejada && npm run build
      - name: Capacitor Sync e Realocação Bruta
        script: |
          cd mais-vaquejada
          echo "Limpando manifestos antigos..."
          rm -f ios/App/CapApp-SPM/Package.swift
          rm -rf ios/App/CapApp-SPM/.swiftpm
          
          npx cap sync ios --deployment
          
          echo "Movendo node_modules para dentro de ios/App para acesso direto..."
          # Move fisicamente para que o Xcode não precise 'sair' da pasta do app
          mv node_modules ios/App/
          
          echo "Ajustando Package.swift para o novo local (../node_modules)..."
          # Altera de ../../../node_modules para ../node_modules
          sed -i '' "s|\.\.\/\.\.\/\.\.\/node_modules|\.\.\/node_modules|g" ios/App/CapApp-SPM/Package.swift
          
          echo "Verificando novos caminhos:"
          cat ios/App/CapApp-SPM/Package.swift | grep "path:"
      - name: Check broken plugins
        script: |
          cd mais-vaquejada
          echo "Verificando se existem plugins problemáticos..."
          ! grep -R "@capgo/capacitor-native-biometric" .
          ! grep -R "@capacitor-community/apple-sign-in" .
          echo "✅ Nenhum plugin problemático encontrado!"
      - name: Build iOS Archive
        script: |
          cd mais-vaquejada/ios/App
          xcodebuild -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $FCI_BUILD_DIR/App.xcarchive \
                     archive \
                     -resolvePackageDependencies
    artifacts:
      - $FCI_BUILD_DIR/*.xcarchive
      - $FCI_BUILD_DIR/ios/App/App.ipa
