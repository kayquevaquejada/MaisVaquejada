workflows:
  ios-workflow:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          cd mais-vaquejada && npm install --force
      - name: Build Web Assets
        script: |
          cd mais-vaquejada && npm run build
      - name: Capacitor Sync e Fix de Caminho Absoluto
        script: |
          cd mais-vaquejada
          npx cap sync ios --deployment
          
          echo "Injetando caminhos absolutos no Package.swift..."
          # Substitui ../../../node_modules pelo caminho real do servidor
          sed -i '' "s|\.\.\/\.\.\/\.\.\/node_modules|$FCI_BUILD_DIR/mais-vaquejada/node_modules|g" ios/App/CapApp-SPM/Package.swift
          
          echo "Verificando se os caminhos foram injetados:"
          cat ios/App/CapApp-SPM/Package.swift | grep "path:"
      - name: Build iOS Archive
        script: |
          cd mais-vaquejada/ios/App
          xcodebuild -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $FCI_BUILD_DIR/App.xcarchive \
                     archive \
                     -resolvePackageDependencies
    artifacts:
      - $FCI_BUILD_DIR/*.xcarchive
      - $FCI_BUILD_DIR/ios/App/App.ipa
