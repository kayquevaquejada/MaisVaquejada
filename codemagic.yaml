workflows:
  ios-workflow:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          cd mais-vaquejada && npm install --force
      - name: Build Web Assets
        script: |
          cd mais-vaquejada && npm run build
      - name: Capacitor Sync e Reset de Pods
        script: |
          cd mais-vaquejada
          npx cap sync ios
          
          echo "Limpando qualquer rastro de SPM..."
          rm -rf ios/App/CapApp-SPM
          
          echo "Desintegrando e Reinstalando Pods (Reset Total)..."
          cd ios/App
          pod deintegrate
          pod install
      - name: Check broken plugins
        script: |
          cd mais-vaquejada
          echo "Verificando plugins quebrados..."
          if grep -R "@capgo/capacitor-native-biometric" . --exclude-dir=node_modules; then
            echo "ERRO: plugin biometric ainda existe no projeto"
            exit 1
          fi

          if grep -R "@capacitor-community/apple-sign-in" . --exclude-dir=node_modules; then
            echo "ERRO: apple-sign-in ainda existe no projeto"
            exit 1
          fi

          if grep -R "@codetrix-studio/capacitor-google-auth" . --exclude-dir=node_modules; then
            echo "ERRO: capacitor-google-auth ainda existe no projeto"
            exit 1
          fi
          echo "✅ Nenhum plugin problemático encontrado!"
      - name: Build iOS Archive (Simples)
        script: |
          cd mais-vaquejada/ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     archive -archivePath $FCI_BUILD_DIR/App.xcarchive
    artifacts:
      - $FCI_BUILD_DIR/*.xcarchive
      - $FCI_BUILD_DIR/ios/App/App.ipa
