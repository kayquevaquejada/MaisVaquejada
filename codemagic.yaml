workflows:
  ios-workflow:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          cd mais-vaquejada && npm install --force
      - name: Build Web Assets
        script: |
          cd mais-vaquejada && npm run build
      - name: Capacitor Sync e Fix de Caminhos
        script: |
          cd mais-vaquejada
          npx cap sync ios --deployment
          # Cria o atalho na raiz para o Xcode não se perder
          cd ..
          ln -s mais-vaquejada/node_modules node_modules
          echo "Atalho de node_modules criado na raiz para compatibilidade SPM."
      - name: Build iOS Archive
        script: |
          cd mais-vaquejada/ios/App
          xcodebuild -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $FCI_BUILD_DIR/App.xcarchive \
                     archive \
                     -resolvePackageDependencies
    artifacts:
      - $FCI_BUILD_DIR/*.xcarchive
      - $FCI_BUILD_DIR/ios/App/App.ipa
