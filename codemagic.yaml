workflows:
  ios-workflow:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      node: 22
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.maisvaquejada.app

      vars:
        VITE_SUPABASE_URL: "https://oisrjnhsrhnhwhcmyutq.supabase.co"
        VITE_SUPABASE_ANON_KEY: "sb_publishable_NlV5EDvJLhrVX0j7T4rNcg_kdo0vB-P"
        BUILD_NUMBER: "53"
        MARKETING_VERSION: "1.3"

    scripts:
      - name: Install dependencies
        script: |
          npm install --force

      - name: Build Web Assets
        script: |
          npm run build

      - name: Capacitor Sync
        script: |
          npx cap sync ios

      - name: Install Pods
        script: |
          cd ios/App
          pod install

      - name: Set iOS version and build number
        script: |
          cd ios/App

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist

          echo "iOS Version:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" App/Info.plist

          echo "iOS Build Number:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" App/Info.plist

      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - ios/App/build/outputs/ipa/*.ipa

    publishing:
      email:
        recipients:
          - kayquevaquejada@gmail.com

  android-workflow:
    name: Android Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 22
      java: 17
      vars:
        VITE_SUPABASE_URL: "https://oisrjnhsrhnhwhcmyutq.supabase.co"
        VITE_SUPABASE_ANON_KEY: "sb_publishable_NlV5EDvJLhrVX0j7T4rNcg_kdo0vB-P"
        SUPABASE_URL: "https://oisrjnhsrhnhwhcmyutq.supabase.co"
        SUPABASE_ANON_KEY: "sb_publishable_NlV5EDvJLhrVX0j7T4rNcg_kdo0vB-P"
        BUILD_NUMBER: "50"
        MARKETING_VERSION: "1.0.42"

    scripts:
      - name: Install dependencies
        script: |
          npm install --force

      - name: Build Web Assets
        script: |
          npm run build

      - name: Capacitor Sync
        script: |
          npx cap sync android

      - name: Build Android
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - kayquevaquejada@gmail.com
