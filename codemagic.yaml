workflows:
  ios-workflow:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      node: 22
      xcode: latest
      vars:
        VITE_SUPABASE_URL: "https://oisrjnhsrnhwhcmyutq.supabase.co"
        VITE_SUPABASE_ANON_KEY: "sb_publishable_NlV5EDvJLhrVX0j7T4rNcg_kdo0vB-P"

    scripts:
      - name: Install dependencies
        script: |
          cd mais-vaquejada
          npm install --force

      - name: Build Web Assets
        script: |
          cd mais-vaquejada
          npm run build

      - name: Capacitor Sync
        script: |
          cd mais-vaquejada
          npx cap sync ios

      - name: Install Pods
        script: |
          cd mais-vaquejada/ios/App
          pod install

      - name: Set up code signing
        script: |
          cd mais-vaquejada
          keychain initialize
          app-store-connect fetch-signing-files com.maisvaquejada.app \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build Archive
        script: |
          cd mais-vaquejada
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination generic/platform=iOS \
            DEVELOPMENT_TEAM=CM6RTC63BW \
            CODE_SIGN_STYLE=Manual \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Export IPA
        script: |
          cd mais-vaquejada
          mkdir -p build/ipa

          cat > export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>CM6RTC63BW</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist export_options.plist

    artifacts:
      - mais-vaquejada/build/ipa/*.ipa

    publishing:
      email:
        recipients:
          - kayquevaquejada@gmail.com
