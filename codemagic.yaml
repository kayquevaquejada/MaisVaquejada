workflows:
  ios-workflow:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mais-vaquejada
    environment:
      node: 20
      xcode: latest
      groups:
        - app_store_credentials # Você precisará criar este grupo no Codemagic depois
    scripts:
      - name: Install dependencies
        script: |
          npm install --force
      - name: Build Web Assets
        script: |
          npm run build
      - name: Capacitor Sync
        script: |
          npx cap sync ios --deployment
      - name: Build iOS Archive
        script: |
          cd ios/App
          xcodebuild -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $FCI_BUILD_DIR/App.xcarchive \
                     archive \
                     -resolvePackageDependencies
    artifacts:
      - $FCI_BUILD_DIR/*.xcarchive
      - $FCI_BUILD_DIR/ios/App/App.ipa
