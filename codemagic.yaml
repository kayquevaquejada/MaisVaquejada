workflows:
  ios-workflow:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          cd mais-vaquejada && npm install --force
      - name: Build Web Assets
        script: |
          cd mais-vaquejada && npm run build
      - name: Capacitor Sync e Destruição de Cache
        script: |
          cd mais-vaquejada
          echo "Destruindo pasta CapApp-SPM para forçar regeneração limpa..."
          rm -rf ios/App/CapApp-SPM
          npx cap sync ios --deployment
          
          echo "Injetando caminhos absolutos no Package.swift..."
          sed -i '' "s|\.\.\/\.\.\/\.\.\/node_modules|$FCI_BUILD_DIR/mais-vaquejada/node_modules|g" ios/App/CapApp-SPM/Package.swift
      - name: Check broken plugins
        script: |
          cd mais-vaquejada
          echo "Verificando se existem plugins problemáticos..."
          ! grep -R "@capgo/capacitor-native-biometric" .
          ! grep -R "@capacitor-community/apple-sign-in" .
          echo "✅ Nenhum plugin problemático encontrado!"
      - name: Build iOS Archive
        script: |
          cd mais-vaquejada/ios/App
          xcodebuild -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $FCI_BUILD_DIR/App.xcarchive \
                     archive \
                     -resolvePackageDependencies
    artifacts:
      - $FCI_BUILD_DIR/*.xcarchive
      - $FCI_BUILD_DIR/ios/App/App.ipa
