workflows:
  ios-workflow:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      vars:
        # Variáveis do Supabase (O Codemagic vai usar estas para o build)
        VITE_SUPABASE_URL: "https://oisrjnhsrnhwhcmyutq.supabase.co"
        VITE_SUPABASE_ANON_KEY: "sb_publishable_NlV5EDvJLhrVX0j7T4rNcg_kdo0vB-P"
    scripts:
      - name: Install dependencies
        script: |
          cd mais-vaquejada && npm install --force
      - name: Build Web Assets
        script: |
          cd mais-vaquejada && npm run build
      - name: Capacitor Sync
        script: |
          cd mais-vaquejada
          npx cap sync ios
      - name: Install Pods
        script: |
          cd mais-vaquejada/ios/App
          pod install
      - name: Build IPA
        script: |
          cd mais-vaquejada
          # Gera o arquivo .xcarchive e o .ipa usando o seu arquivo plist
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --export-options-plist export_options.plist
    artifacts:
      - mais-vaquejada/ios/App/build/outputs/ipa/*.ipa
    publishing:
      email:
        recipients:
          - kayquevaquejada@gmail.com
