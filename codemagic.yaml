# Build Version: 1.0.19
workflows:
  ios-workflow:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          cd mais-vaquejada && npm install --force
      - name: Build Web Assets
        script: |
          cd mais-vaquejada && npm run build
      - name: Capacitor Copy e Sync
        script: |
          cd mais-vaquejada
          npx cap copy ios
          npx cap sync ios
          echo "Arquivos dentro de ios/App/App:"
          ls -la ios/App/App
          echo "Public:"
          ls -la ios/App/App/public || true
      - name: Check broken plugins
        script: |
          cd mais-vaquejada
          echo "Verificando plugins quebrados..."
          if grep -R "@capgo/capacitor-native-biometric" . --exclude-dir=node_modules; then
            echo "ERRO: plugin biometric ainda existe no projeto"
            exit 1
          fi

          if grep -R "@capacitor-community/apple-sign-in" . --exclude-dir=node_modules; then
            echo "ERRO: apple-sign-in ainda existe no projeto"
            exit 1
          fi

          if grep -R "@codetrix-studio/capacitor-google-auth" . --exclude-dir=node_modules; then
            echo "ERRO: capacitor-google-auth ainda existe no projeto"
            exit 1
          fi
          echo "✅ Nenhum plugin problemático encontrado!"
      - name: Reset Pods
        script: |
          cd mais-vaquejada/ios/App
          rm -rf Pods Podfile.lock
          pod deintegrate
          pod install
      - name: Build IPA
        script: |
          cd mais-vaquejada
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --export-options-plist export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - mais-vaquejada/ios/App/build/*.xcarchive
