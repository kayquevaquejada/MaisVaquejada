workflows:
  ios-workflow:
    name: iOS Build & Deploy
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          cd mais-vaquejada && npm install --force
      - name: Build Web Assets
        script: |
          cd mais-vaquejada && npm run build
      - name: Capacitor Sync e CocoaPods
        script: |
          cd mais-vaquejada
          # Sincroniza sem forçar SPM
          npx cap sync ios
          
          echo "Rodando Pod Install (Estabilidade Total)..."
          cd ios/App
          pod install
      - name: Check broken plugins
        script: |
          cd mais-vaquejada
          echo "Verificando se existem plugins problemáticos..."
          ! grep -R "@capgo/capacitor-native-biometric" .
          ! grep -R "@capacitor-community/apple-sign-in" .
          echo "✅ Nenhum plugin problemático encontrado!"
      - name: Build iOS Archive (Workspace Mode)
        script: |
          cd mais-vaquejada/ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $FCI_BUILD_DIR/App.xcarchive \
                     archive
    artifacts:
      - $FCI_BUILD_DIR/*.xcarchive
      - $FCI_BUILD_DIR/ios/App/App.ipa
